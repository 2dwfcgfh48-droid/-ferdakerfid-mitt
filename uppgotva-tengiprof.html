<!doctype html><html lang="is"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uppgötva — tengipróf</title><style>
:root{font-family:system-ui,sans-serif;color-scheme:light dark}body{margin:auto;padding:1rem;max-width:42rem;line-height:1.5}h1{font-size:1.5rem}label{display:block;margin:1rem 0}select,button{font:inherit;padding:.75rem;width:100%;box-sizing:border-box}button{cursor:pointer}li{margin:.75rem 0;overflow-wrap:anywhere}#status{padding:.75rem;border:1px solid #888;border-radius:.5rem;white-space:pre-wrap}a{color:inherit}
</style><h1>🧭 Uppgötva — tengipróf</h1><p>Prófið notar núverandi innskráningu og les ferðir og áfangastaði sem þú hefur aðgang að. Það breytir engum bókunum eða ferðagögnum.</p><p><a href="./">Til baka í Ferðakerfið Mitt</a></p><p id="status" role="status" aria-live="polite">Athuga innskráningu…</p><section id="controls" hidden><label>Ferð<select id="trip"></select></label><label>Áfangastaður<select id="stop"></select></label><label>Prófunarflokkur<select id="category"><option value="food">Matur og drykkur</option><option value="sights">Áhugaverðir staðir</option><option value="practical">Hagnýtt — fyrstu undirflokkar</option></select></label><button type="button" id="search" disabled>Prófa leit í 5 km nágrenni</button></section><ul id="results"></ul><p id="source" hidden><a href="https://www.geoapify.com/" target="_blank" rel="noopener noreferrer">Powered by Geoapify</a> · <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">© OpenStreetMap contributors</a></p><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.117.2';
const url='https://omvfsaokykpclzecfqlw.supabase.co',key='sb_publishable_jD9bmxnOpo5-ZUZsddKTtA_avOker7P';
const db=createClient(url,key),$=id=>document.getElementById(id);let stops=[],sequence=0,abort=null,userId=null;
function cancel(){sequence++;abort?.abort();abort=null;$('results').replaceChildren();$('source').hidden=true}
const text=v=>$('status').textContent=v;
function reset(){cancel();stops=[];$('controls').hidden=true;$('trip').replaceChildren();$('stop').replaceChildren();$('search').disabled=true}
const valid=s=>s&&s.latitude!==null&&s.longitude!==null&&s.latitude!==''&&s.longitude!==''&&Number.isFinite(Number(s.latitude))&&Number.isFinite(Number(s.longitude))&&Math.abs(Number(s.latitude))<=90&&Math.abs(Number(s.longitude))<=180;
function option(value,label){const o=document.createElement('option');o.value=value;o.textContent=label;return o}
async function loadStops(){cancel();const current=sequence;stops=[];$('stop').replaceChildren();$('search').disabled=true;text('Sæki áfangastaði…');try{const {data,error}=await db.from('trip_stops').select('id,name,latitude,longitude').eq('trip_id',$('trip').value).order('order_index');if(current!==sequence)return;if(error)throw error;stops=data||[];for(const s of stops){const o=option(s.id,s.name+(valid(s)?'':' — hnit vantar'));o.disabled=!valid(s);$('stop').append(o)}const first=stops.find(valid);if(first)$('stop').value=first.id;$('search').disabled=!first;text(first?'Veldu flokk og ýttu einu sinni á prófunarhnappinn.':'Þessa ferð vantar áfangastað með skráðum hnitum. Veldu aðra ferð.')}catch{if(current===sequence)text('Ekki tókst að sækja áfangastaði. Opnaðu appið og staðfestu innskráningu.')}}
async function start(){reset();const current=sequence;try{const {data:{session}}=await db.auth.getSession();if(current!==sequence)return;if(!session){text('Engin innskráning fannst. Opnaðu Ferðakerfið Mitt í sama Safari-vafra, skráðu þig inn og opnaðu þessa síðu aftur.');return}userId=session.user.id;const {data,error}=await db.from('trips').select('id,name').limit(50);if(current!==sequence)return;if(error)throw error;if(!data?.length){text('Engin ferð aðgengileg í þessari innskráningu.');return}for(const t of data)$('trip').append(option(t.id,t.name||'Ónefnd ferð'));$('controls').hidden=false;await loadStops()}catch{text('Ekki tókst að lesa ferðalista. Opnaðu appið og staðfestu innskráningu.')}}
$('trip').onchange=loadStops;$('stop').onchange=()=>{cancel();text('Veldu flokk og prófaðu leit.');$('search').disabled=!valid(stops.find(s=>s.id===$('stop').value))};$('category').onchange=()=>{cancel();text('Veldu prófunarhnappinn til að leita.');$('search').disabled=!valid(stops.find(s=>s.id===$('stop').value))};
$('search').onclick=async()=>{const s=stops.find(s=>s.id===$('stop').value);if(!valid(s))return;cancel();const current=sequence,controller=new AbortController();abort=controller;const timer=setTimeout(()=>controller.abort(),25000);$('search').disabled=true;text('Sæki raunveruleg gögn frá staðaleit…');try{const {data:{session}}=await db.auth.getSession();if(current!==sequence)return;if(!session||session.user.id!==userId)throw Error('auth');const response=await fetch(url+'/functions/v1/nearby-places',{method:'POST',headers:{Authorization:'Bearer '+session.access_token,apikey:key,'Content-Type':'application/json'},body:JSON.stringify({trip_id:$('trip').value,category:$('category').value,center:[Number(s.longitude),Number(s.latitude)],radius_km:5}),signal:controller.signal});const data=await response.json();if(current!==sequence)return;if(!response.ok||data.error){text('Leit tókst ekki (HTTP '+response.status+'): '+(data.error||data.message||'Óþekkt villa.'));return}if(!Array.isArray(data.results))throw Error('shape');for(const p of data.results){const li=document.createElement('li');li.textContent=p.name+(p.address?' · '+p.address:'');$('results').append(li)}$('source').hidden=false;text('Tenging svaraði: HTTP '+response.status+' · '+data.results.length+' niðurstöður við '+s.name+'.\n'+(data.cached?'Fersk niðurstaða úr skyndiminni.':'Ný niðurstaða frá Geoapify.')+'\nListinn er ekki tæmandi. Engin gögn voru vistuð í ferðinni.')}catch(e){if(current===sequence)text(e.name==='AbortError'?'Svarfrestur rann út.':'Tengipróf tókst ekki. Staðfestu innskráningu og nettengingu.')}finally{clearTimeout(timer);if(current===sequence)$('search').disabled=false}};
db.auth.onAuthStateChange((_event,session)=>{if(userId&&session?.user?.id!==userId){userId=null;reset();text('Innskráning breyttist. Endurhlaðaðu síðuna.')}});
start();
</script></html>
